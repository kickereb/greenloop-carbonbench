[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "greenloop-carbonbench"
version = "0.1.0"
description = "Reproducible local Ollama inference telemetry for the GreenLoop CarbonBench pilot"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GreenLoop project" }]
dependencies = []

[project.scripts]
carbonbench = "carbonbench.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

